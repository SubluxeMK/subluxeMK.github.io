function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
document.getElementById("go").addEventListener("click", function(){
  var val = document.getElementById("pw").value || "";
  var r1 = document.getElementById("r1"), r2 = document.getElementById("r2");
  r1.textContent = "Checking…"; r2.textContent = "";
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(val)).then(function(buf){
    var hex = Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    if (hex === JOURNAL_HASH) { r1.textContent = "1. Password matches the site gate: YES"; r1.className = "ok"; }
    else { r1.textContent = "1. Password matches the site gate: NO"; r1.className = "bad"; }
    return crypto.subtle.importKey("raw", new TextEncoder().encode(val), "PBKDF2", false, ["deriveKey"]);
  }).then(function(base){
    return crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(JOURNAL_KDF_SALT), iterations:250000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  }).then(function(key){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENTRY.iv) }, key, b64(ENTRY.data));
  }).then(function(buf){
    var obj = JSON.parse(new TextDecoder().decode(buf));
    r2.textContent = "2. Entry unscrambles: YES — title: “" + (obj.title || "") + "”, date: " + (obj.date || "");
    r2.className = "ok";
  }).catch(function(e){
    r2.textContent = "2. Entry unscrambles: NO (" + (e && e.name ? e.name : "error") + ")";
    r2.className = "bad";
  });
});
