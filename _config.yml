title: "Subluxe"
description: "A personal site — a little about me, my pictures, and my writing."
baseurl: ""
url: "https://subluxe.ca"

markdown: kramdown
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag

nav:
  - name: "Home"
    link: "/"
  - name: "Photos"
    link: "/photos/"
  - name: "Writing"
    link: "/blog/"
  - name: "About"
    link: "/#about"

# Comments via giscus (https://giscus.app). The widget only renders on posts
# once repo_id and category_id are filled in. To finish setup: enable
# Discussions on the repo, install the giscus GitHub App, then generate the
# values at giscus.app and paste them below.
giscus:
  repo: "SubluxeMK/subluxeMK.github.io"
  repo_id: ""
  category: "General"
  category_id: ""
  mapping: "pathname"
  reactions_enabled: "1"
  theme: "light"
