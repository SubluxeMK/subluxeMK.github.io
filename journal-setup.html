<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Journal password setup — Subluxe</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#8f92e2,#7678d6);font-family:"MS Sans Serif",Tahoma,Verdana,sans-serif;color:#111;padding:20px;box-sizing:border-box;}
  .win{background:#c0c0c0;max-width:460px;width:100%;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;padding:3px;}
  .titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:5px 10px;font-size:14px;}
  .body{padding:18px;font-size:14px;line-height:1.5;}
  .sunken{background:#fff;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;padding:12px;}
  input[type=password]{width:100%;box-sizing:border-box;padding:7px 8px;font:inherit;margin:4px 0 12px;}
  button{font:inherit;padding:6px 22px;background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;cursor:pointer;border:0;}
  button:active{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080;}
  textarea{width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;padding:8px;margin-top:6px;}
  .err{color:#b00020;min-height:1.2em;}
</style>
</head>
<body>
  <div class="win">
    <div class="titlebar">🔒 Journal — Set Password</div>
    <div class="body">
      <p>Choose the password for the Journal section of subluxe.ca. Your password is turned into a code <strong>right here in your browser</strong> — the password itself never leaves this page. Send Muse the code, and the gate goes live.</p>
      <form id="f">
        <label for="pw1">New journal password</label>
        <input id="pw1" type="password" autocomplete="new-password" />
        <label for="pw2">Type it again</label>
        <input id="pw2" type="password" autocomplete="new-password" />
        <button type="submit">Create my code</button>
        <p class="err" id="err"></p>
      </form>
      <div id="out" hidden>
        <p><strong>Your code:</strong> (send this to Muse)</p>
        <textarea id="hash" rows="3" readonly></textarea>
      </div>
    </div>
  </div>
<script>
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    var err = document.getElementById("err");
    if (a.length < 4) { err.textContent = "Please use at least 4 characters."; return; }
    if (a !== b) { err.textContent = "The two passwords don't match — try again."; return; }
    err.textContent = "";
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(a)).then(function(buf){
      var hex = Array.prototype.map.call(new Uint8Array(buf), function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
      document.getElementById("hash").value = hex;
      document.getElementById("out").hidden = false;
    });
  });
</script>
</body>
</html>
