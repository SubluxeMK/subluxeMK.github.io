    <style>
      :root{
        --peri:#7f83d8;
        --peri-dark:#5d61b8;
        --face:#c0c0c0;
        --face-light:#dfdfdf;
        --white:#ffffff;
        --black:#000000;
        --navy:#000080;
        --navy-2:#1084d0;
        --ink:#111111;
        --ink-soft:#333333;
        --pale:#e8e6df;
        --pale-blue:#d6ddef;
        --focus:#000080;
      }
      *{box-sizing:border-box;}
      html,body{height:100%;}
      body{
        margin:0;
        font-family:Tahoma,Verdana,"Segoe UI",Geneva,sans-serif;
        color:var(--ink);
        background:var(--peri);
        overflow-x:hidden;
        -webkit-font-smoothing:antialiased;
      }
      button{font-family:inherit;}

      /* ---------- bevels ---------- */
      .raised{
        background:var(--face);
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #ffffff,
          inset -2px -2px #808080,
          inset 2px 2px #dfdfdf;
      }
      .sunken{
        background:var(--white);
        box-shadow:
          inset -1px -1px #ffffff,
          inset 1px 1px #0a0a0a,
          inset -2px -2px #dfdfdf,
          inset 2px 2px #808080;
      }
      .btn95{
        min-height:36px;
        min-width:36px;
        padding:6px 14px;
        border:0;
        background:var(--face);
        color:var(--ink);
        font-size:13px;
        cursor:pointer;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #ffffff,
          inset -2px -2px #808080,
          inset 2px 2px #dfdfdf;
        display:inline-flex;align-items:center;justify-content:center;gap:7px;
        text-decoration:none;
        user-select:none;
      }
      .btn95:active:not(:disabled), .btn95.pressed{
        box-shadow:
          inset -1px -1px #ffffff,
          inset 1px 1px #0a0a0a,
          inset -2px -2px #dfdfdf,
          inset 2px 2px #808080;
      }
      .btn95:focus-visible, a:focus-visible, .menu-btn:focus-visible, .desk-icon:focus-visible{
        outline:2px dotted var(--focus);
        outline-offset:-4px;
      }

      /* ---------- desktop ---------- */
      .desktop{
        min-height:100dvh;
        padding:18px 16px 64px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255,255,255,.08), transparent 42%),
          linear-gradient(180deg,#8f92e2, var(--peri) 40%, var(--peri-dark));
        position:relative;
      }
      .desk-icons{
        position:absolute;
        top:16px;left:12px;
        display:flex;flex-direction:column;gap:8px;
        z-index:5;
      }
      .desk-icon{
        width:84px;min-height:64px;
        background:transparent;border:0;cursor:pointer;
        color:#fff;
        display:flex;flex-direction:column;align-items:center;gap:5px;
        padding:8px 4px;
        font-size:12px;text-align:center;
        text-shadow:1px 1px 1px rgba(0,0,0,.7);
      }
      .desk-icon .glyph{
        width:34px;height:34px;display:grid;place-items:center;
        background:var(--face);
        box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;
        font-size:18px;
      }
      .desk-icon span.label{line-height:1.15;padding:1px 3px;}
      .desk-icon.selected span.label{background:var(--navy);}

      /* ---------- main window ---------- */
      .stage{
        position:relative;
        z-index:2;
        display:flex;justify-content:center;
        padding-left:96px;
      }
      .window{
        width:min(1020px,100%);
        padding:3px;
        position:relative;
        background:var(--face);
      }
      .window.maximized{
        position:fixed;inset:0;z-index:40;width:auto;
        display:flex;flex-direction:column;
      }
      .window.maximized .win-body{flex:1;overflow:auto;}
      .window.hidden-window{display:none;}

      .titlebar{
        background:linear-gradient(90deg,var(--navy),var(--navy-2));
        color:#fff;
        display:flex;align-items:center;gap:8px;
        padding:4px 4px 4px 8px;
        min-height:36px;
        cursor:grab;
        user-select:none;
        touch-action:none;
      }
      .titlebar:active{cursor:grabbing;}
      .titlebar .t-icon{
        width:20px;height:20px;flex:0 0 20px;
        background:#000;display:grid;place-items:center;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
      }
      .titlebar .t-text{
        font-weight:700;font-size:14px;letter-spacing:.2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
      }
      .titlebar .t-btns{display:flex;gap:3px;}
      .t-btn{
        width:36px;height:28px;min-height:28px;
        padding:0;font-size:13px;font-weight:700;line-height:1;
      }

      /* menu bar — the header titles live here, and they work */
      .menubar{
        display:flex;flex-wrap:wrap;gap:2px;
        padding:4px;
        border-bottom:1px solid #808080;
        box-shadow:0 1px 0 #ffffff;
      }
      .menu-btn{
        min-height:36px;
        border:0;background:transparent;color:var(--ink);
        font-size:14px;padding:7px 16px;cursor:pointer;
      }
      .menu-btn u{text-decoration:underline;}
      .menu-btn:hover{background:var(--navy);color:#fff;}
      .menu-btn.active{
        background:var(--face);
        box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080;
        font-weight:700;
      }
      .menu-btn.active:hover{color:var(--ink);}

      /* address / location bar */
      .addrbar{
        display:flex;align-items:center;gap:8px;
        padding:6px 8px;
        font-size:13px;
      }
      .addrbar label{white-space:nowrap;}
      .addr-field{
        flex:1;min-height:30px;display:flex;align-items:center;gap:8px;
        padding:4px 8px;background:#fff;font-family:"Courier New",monospace;font-size:13px;
        overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
      }

      .win-body{
        margin:2px;padding:14px;
        background:var(--face);
      }
      .view{display:none;}
      .view.active{display:block;animation:pop .12s ease-out;}
      @keyframes pop{from{opacity:.4}to{opacity:1}}
      @media (prefers-reduced-motion: reduce){
        .view.active{animation:none;}
      }

      /* ---------- home content ---------- */
      .hero{
        display:grid;grid-template-columns:220px 1fr;gap:14px;
        margin-bottom:14px;
      }
      .portrait{
        background:#fdfdfa;color:var(--ink);
        aspect-ratio:3/4;
        align-self:start;
        position:relative;overflow:hidden;
        text-align:center;
      }
      .portrait .p-photo{
        position:absolute;inset:0;width:100%;height:100%;
        object-fit:cover;object-position:center;display:block;
      }
      .portrait .jp{
        position:absolute;top:8px;right:10px;z-index:2;
        font-size:12px;color:#2f6fd0;letter-spacing:2px;
      }
      .portrait .p-text{
        position:absolute;left:10px;right:10px;bottom:8px;z-index:2;
        display:flex;flex-direction:column;align-items:center;gap:6px;
      }
      .portrait .name-jp{font-size:12px;color:var(--ink-soft);letter-spacing:3px;}
      .portrait .p-name{font-size:20px;font-weight:700;letter-spacing:4px;color:var(--ink);}
      .portrait .p-sub{font-size:11px;color:var(--ink-soft);line-height:1.5;}

      .title-tab{
        background:var(--navy);color:#fff;
        padding:10px 18px;
        font-size:26px;font-weight:700;letter-spacing:1px;
        clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);
        margin-bottom:10px;
      }
      .profile-card{padding:12px;background:var(--pale);}
      .profile-line{
        display:flex;flex-wrap:wrap;align-items:center;gap:10px;
        font-size:15px;margin-bottom:12px;
      }
      .profile-line .who{font-weight:700;}
      .profile-line .spacer{flex:1;}
      .social-row{display:flex;flex-wrap:wrap;gap:8px;}
      .social-btn{font-weight:700;font-size:13px;}
      .social-btn .dot{width:10px;height:10px;display:inline-block;}
      .dot-twitch{background:#9146ff;box-shadow:inset -1px -1px rgba(0,0,0,.4),inset 1px 1px rgba(255,255,255,.5);}
      .dot-x{background:#000;box-shadow:inset -1px -1px rgba(0,0,0,.4),inset 1px 1px rgba(255,255,255,.5);}
      .profile-note{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0;}

      .panels{
        display:grid;grid-template-columns:1fr 1fr;gap:14px;
      }
      .panel{padding:3px;display:flex;flex-direction:column;}
      .panel-body{flex:1;}
      .panel-head{
        background:var(--pale-blue);
        border-bottom:1px solid #808080;
        padding:8px 12px;font-weight:700;font-size:14px;
        display:flex;align-items:center;gap:8px;
      }
      .panel-head .ph-icon{font-size:14px;}
      .panel-body{
        background:#fff;padding:12px 14px;font-size:14px;line-height:1.65;color:var(--ink-soft);
      }
      .panel-body p{margin:0 0 10px;}
      .panel-body p:last-child{margin-bottom:0;}
      .panel-body ul{margin:0;padding-left:18px;}
      .panel-body li{margin:3px 0;}
      .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;}
      .kv dt{font-weight:700;color:var(--ink);}
      .kv dd{margin:0;}
      .span-2{grid-column:span 2;}

      /* ---------- explorer views (photos / writing / projects) ---------- */
      .explorer-head{
        display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px;
      }
      .explorer-head h2{font-size:20px;margin:0;}
      .explorer-head p{margin:0;font-size:13px;color:var(--ink-soft);}
      .photo-grid{
        display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
      }
      .photo-cell{padding:6px;text-align:center;}
      .photo-frame{
        aspect-ratio:4/3;background:#fdfdf8;display:grid;place-items:center;
        font-size:26px;color:#808080;margin-bottom:6px;
      }
      .photo-frame.has-photo{display:block;padding:0;overflow:hidden;}
      .photo-frame.has-photo img{
        width:100%;height:100%;display:block;object-fit:cover;object-position:center;
      }
      .photo-cell figcaption{font-size:12px;color:var(--ink-soft);padding:2px 0 4px;}
      .list-table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;}
      .list-table th{
        text-align:left;background:var(--face);padding:8px 10px;font-size:13px;
        box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;
      }
      .list-table td{padding:10px;border-bottom:1px solid #e3e3e3;color:var(--ink-soft);}
      .empty-note{
        background:#ffffe1;border:1px solid #808080;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink-soft);
      }
      .empty-note strong{color:var(--ink);}

      /* status bar */
      .statusbar{
        display:flex;gap:3px;padding:3px;font-size:12px;color:var(--ink-soft);
        background:var(--face);
      }
      .status-cell{
        padding:5px 10px;min-height:26px;display:flex;align-items:center;
        box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;
      }
      .status-cell.grow{flex:1;}

      /* ---------- close dialog ---------- */
      .dialog-wrap{
        position:fixed;inset:0;z-index:60;display:none;
        align-items:center;justify-content:center;padding:16px;
        background:rgba(0,0,0,.18);
      }
      .dialog-wrap.open{display:flex;}
      .dialog{width:min(420px,100%);padding:3px;}
      .dialog .d-body{padding:16px;background:var(--face);font-size:14px;line-height:1.6;}
      .dialog .d-btns{display:flex;gap:8px;justify-content:center;padding:0 16px 16px;background:var(--face);flex-wrap:wrap;}

      /* ---------- taskbar ---------- */
      .taskbar{
        position:fixed;left:0;right:0;bottom:0;z-index:50;
        background:var(--face);
        box-shadow:inset 0 1px #dfdfdf,inset 0 2px #ffffff;
        display:flex;align-items:center;gap:8px;
        padding:4px 6px calc(4px + env(safe-area-inset-bottom));
        min-height:48px;
      }
      .start-btn{
        font-weight:700;font-size:14px;gap:8px;padding:6px 14px;
      }
      .start-btn .flag{display:grid;grid-template-columns:8px 8px;grid-template-rows:8px 8px;gap:1px;}
      .start-btn .flag i{display:block;}
      .f-r{background:#ff3b30;}.f-g{background:#34c759;}.f-b{background:#0a84ff;}.f-y{background:#ffd60a;}
      .task-div{width:2px;align-self:stretch;box-shadow:inset -1px 0 #fff,inset 1px 0 #808080;}
      .task-btn{
        flex:0 1 260px;justify-content:flex-start;font-size:13px;font-weight:700;
        overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
      }
      .taskbar .spacer{flex:1;}
      .clock{
        min-height:36px;display:flex;align-items:center;padding:4px 12px;font-size:13px;
        box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;
        font-variant-numeric:tabular-nums;white-space:nowrap;
      }

      /* start menu */
      .start-menu{
        position:fixed;left:6px;bottom:54px;z-index:55;
        width:min(300px,calc(100vw - 12px));padding:3px;display:none;
      }
      .start-menu.open{display:block;}
      .start-menu .sm-inner{display:flex;background:var(--face);}
      .start-menu .sm-rail{
        background:linear-gradient(180deg,var(--navy),var(--navy-2));
        color:#fff;width:34px;display:flex;align-items:flex-end;justify-content:center;padding:8px 0;
      }
      .start-menu .sm-rail span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:14px;letter-spacing:1px;}
      .start-menu ul{list-style:none;margin:0;padding:4px;flex:1;}
      .start-menu li button,.start-menu li a{
        width:100%;min-height:40px;display:flex;align-items:center;gap:10px;
        background:transparent;border:0;padding:8px 10px;font-size:14px;color:var(--ink);
        cursor:pointer;text-decoration:none;text-align:left;
      }
      .start-menu li button:hover,.start-menu li a:hover{background:var(--navy);color:#fff;}
      .start-menu .sep{height:2px;margin:4px 6px;box-shadow:inset 0 1px #808080,inset 0 2px #fff;}

      /* ---------- responsive ---------- */
      @media (max-width:860px){
        .stage{padding-left:0;padding-top:86px;}
        .desk-icons{flex-direction:row;flex-wrap:wrap;top:10px;left:8px;right:8px;}
        .desk-icon{width:72px;min-height:58px;font-size:11px;}
        .hero{grid-template-columns:1fr;}
        .portrait{aspect-ratio:4/3;}
        .portrait .p-photo{object-position:center 20%;}
        .panels{grid-template-columns:1fr;}
        .span-2{grid-column:span 1;}
        .photo-grid{grid-template-columns:repeat(2,1fr);}
        .title-tab{font-size:22px;}
        .desktop{padding:12px 8px 64px;}
        .win-body{padding:10px;}
        .task-btn{flex-basis:150px;}
      }
      @media (max-width:420px){
        .photo-grid{grid-template-columns:1fr 1fr;gap:8px;}
        .menu-btn{padding:7px 10px;font-size:13px;}
        .clock{display:none;}
      }
    </style>
    <style>
      .post-body{ background:#fff; padding:26px 30px; line-height:1.65; }
      .post-body h1{ margin:0 0 6px; font-size:26px; }
      .post-date{ color:#555; margin:0 0 18px; font-size:13px; }
      .post-body p{ margin:0 0 14px; }
    </style>
  </head>
  <body>
    <div class="desktop" id="desktop">
      <div class="stage">
        <section class="window raised" aria-label="Subluxe article window">
          <div class="titlebar">
            <span class="t-text">Subluxe — Writing</span>
            <div class="t-btns">
              <a class="btn95 t-btn" href="/#writing" aria-label="Back to Writing" style="text-decoration:none;color:inherit;display:inline-block;text-align:center;">✕</a>
            </div>
          </div>
          <nav class="menubar" aria-label="Article navigation">
            <a class="menu-btn" href="/#writing" style="text-decoration:none;color:inherit;">← <u>B</u>ack to Writing</a>
            <a class="menu-btn" href="/" style="text-decoration:none;color:inherit;"><u>H</u>ome</a>
          </nav>
          <div class="addrbar" aria-hidden="true">
            <span class="addr-label">Address</span>
            <div class="addr-field sunken">C:\subluxe\writing\{{ page.slug }}</div>
          </div>
          <div class="win-body sunken" style="background:var(--face);box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;">
            <article class="post-body">
              <h1>{{ page.title }}</h1>
              <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
              {{ content }}
            </article>
          </div>
          <div class="statusbar" aria-hidden="true">
            <div class="status-cell grow">Writing — {{ page.title }}</div>
            <div class="status-cell">1 object(s)</div>
          </div>
        </section>
      </div>
    </div>
    <footer class="taskbar">
      <a class="btn95 start-btn" href="/" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:5px;">
        <span class="flag" aria-hidden="true"><i class="f-r"></i><i class="f-g"></i><i class="f-b"></i><i class="f-y"></i></span>
        Start
      </a>
      <div class="task-div" aria-hidden="true"></div>
      <div class="btn95 task-btn pressed" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">Subluxe — Writing</div>
      <div class="spacer"></div>
      <div class="clock" id="postClock" aria-label="Current time">--:--</div>
    </footer>
    <script>
      (function(){
        function tick(){
          var d = new Date();
          var h = d.getHours(), m = ("0"+d.getMinutes()).slice(-2);
          var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
          document.getElementById("postClock").textContent = h + ":" + m + " " + ap;
        }
        tick(); setInterval(tick, 30000);
      })();
    </script>
  </body>
</html>
