<footer class="site-footer">
  <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  {% if site.data.profile.links and site.data.profile.links.size > 0 %}
  <p class="footer-links">
    {% for link in site.data.profile.links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
  </p>
  {% endif %}
  <p class="footer-note">( made with jekyll · hosted on github pages )</p>
</footer>
