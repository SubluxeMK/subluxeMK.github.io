<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">subluxe</a>
    <nav class="header-nav">
      {% for item in site.nav %}
        <a href="{{ item.link | relative_url }}"{% if page.url == item.link %} class="active"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
